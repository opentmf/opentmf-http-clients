name: Maven build

# Builds and runs the full test suite (unit and integration tests, the per-module coverage
# checks) on every pull request and every push to develop, as `mvn clean verify` does locally,
# without the Sonar profile. GitHub-hosted runners only. No secrets, no Sonar, nothing
# published or deployed: snapshots and releases are not made here.

on:
  push:
    branches:
      - develop
  pull_request:

# Read-only for every job; a job that declares its own block replaces this one.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build's enforcer accepts JDK 17 only, and Maven 3.9.x (the runner image's own).
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
